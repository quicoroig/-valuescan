name: ValueScan diario
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 09:00 Madrid (verano). Cambia la hora aquí.
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scan.py --minval 20 --minsure 10 --bank 1000
        env: { ODDSPAPI_KEY: "${{ secrets.ODDSPAPI_KEY }}" }
      - run: |
          git config user.name valuescan && git config user.email bot@valuescan
          git add picks.json && git commit -m "picks $(date -u +%F)" || exit 0
          git push
